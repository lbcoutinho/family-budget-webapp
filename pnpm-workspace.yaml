packages:
  - 'apps/*'
  - 'packages/*'

# Native module used by `eslint-import-resolver-typescript`; its postinstall selects the
# platform-specific binding. Denying the build leaves the resolver without a native backend.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  # argon2 (M2-T02) ships prebuilt bindings for every platform this project runs on, so its
  # install script is normally a no-op that only picks one. Allowed anyway, because on a
  # platform without a matching prebuild the same script is what compiles the addon from source.
  argon2: true
  # esbuild ships a platform-specific binary via its install script; tsx (the OpenAPI export)
  # and Vite/Vitest all drive it, so the binding must be built.
  esbuild: true
  # Telemetry-only package; nothing needs its install script to run.
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true

# Refuse to install on a Node version outside the `engines` range in package.json,
# instead of printing a warning nobody reads. (pnpm 11 reads this here, not from .npmrc.)
engineStrict: true

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Same pattern as ci.yml: one in-flight run per branch, superseded commits stop burning minutes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest

    # Job-scoped and minimal — no repo-wide default write.
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # One CodeQL language covers both JS and TS, across apps/api, apps/web and packages/.
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Interpreted language: nothing to build, so no install/build step is needed.
          build-mode: none
          queries: security-and-quality
          paths-ignore:
            - prototypes/**

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
